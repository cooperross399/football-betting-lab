[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-betting-lab"
version = "0.1.0"
description = "Football betting lab — NFL now, NCAAF later. Evidence first."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# An xpass must reach the junit file as a <failure>, or the skip gate in
# scripts/check_test_results.py cannot see it.
xfail_strict = true
