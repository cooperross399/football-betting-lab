name: Weekly Ledger Check

# The bought population is complete and cannot grow. The forward ledger is the
# only evidence this lab can still gather, it accrues at 272 games a season,
# and it CANNOT BE BACK-DATED. A game day that was never frozen is sample that
# does not exist.
#
# This is deliberately a SECOND, INDEPENDENT workflow rather than a step inside
# the gameday run. The failures it looks for are failures OF that run — a
# process that died before freezing, a guard that stood down on the wrong day,
# a provider that returned nothing — and a check that lives inside the thing it
# checks cannot see them. It reports even when the gameday workflow never
# started, which is the case that matters most.

on:
  schedule:
    # Tuesday 14:00 UTC: after Monday night's game has settled and nflverse has
    # published, and with the whole week still ahead to fix what it finds. A
    # check that runs on Sunday morning reports a loss nobody can act on.
    - cron: "0 14 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to check"
        required: false
        default: "2026"

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-ledger-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet -e .

      - name: Restore the ledger from card-feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Restore into EXACTLY the layout the card writes and every reader
          # reads: data/processed/forward_evidence.csv and
          # data/archive/priced_snapshots/ (`ledger_path()` and
          # `snapshots_dir(ARCHIVE_DIR)`). This wrote the ledger to
          # data/outputs/nfl_forward/ and the snapshots to a `snapshots/` folder
          # no code reads, so from Week 1 every played game day read as LOST
          # and the evidence report called a 132,856-row ledger empty. A test
          # executes this block and checks it against those two functions.
          # Restores are written to a temp path and moved only on success,
          # because a failed `git show` still creates the redirect target and
          # pandas refuses a zero-byte CSV.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          mkdir -p data/processed data/archive/priced_snapshots
          # Two statements, not `git init && cd`: set -e ignores a failure on
          # the left of `&&`, and this block would then fetch into the checkout
          # itself and write one directory above it.
          git init -q feed
          cd feed
          if ! git fetch --depth=1 "$REMOTE" +refs/heads/card-feed:refs/card-feed-tip 2>/dev/null; then
            echo "::warning::No card-feed branch. Nothing to check yet."
            exit 0
          fi
          TMP=$(mktemp)
          if git show refs/card-feed-tip:forward_evidence.csv > "$TMP" 2>/dev/null \
             && [ -s "$TMP" ]; then
            mv "$TMP" ../data/processed/forward_evidence.csv
            echo "Ledger restored: $(( $(wc -l < ../data/processed/forward_evidence.csv) - 1 )) rows."
          else
            rm -f "$TMP"
            echo "No ledger on card-feed yet."
          fi
          for f in $(git ls-tree -r --name-only refs/card-feed-tip | grep '^snapshots/' || true); do
            TMP=$(mktemp)
            if git show "refs/card-feed-tip:$f" > "$TMP" 2>/dev/null && [ -s "$TMP" ]; then
              mv "$TMP" "../data/archive/priced_snapshots/$(basename "$f")"
            else
              rm -f "$TMP"
              echo "::warning::Could not restore $f from card-feed."
            fi
          done
          echo "Snapshots restored: $(ls ../data/archive/priced_snapshots | wc -l)."

      - name: Fetch the schedule
        id: schedule
        # `|| true` was here too — on the step that builds this watchdog's own
        # calendar, directly above the comment explaining why `|| true` is
        # forbidden. That is the fourth time this family has appeared in this
        # repository and the second time inside a fix for itself.
        #
        # It is the worst placement of the four. A committed schedule cache
        # already exists, so a silently failed fetch does not empty the
        # calendar — it leaves a STALE one, and the coverage check then runs
        # against it and reports **intact**. The NFL flexes games between
        # windows and dates all season; a watchdog comparing the ledger to last
        # month's calendar answers confidently and wrongly, which is worse than
        # not answering.
        continue-on-error: true
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/fetch_football_data.py \
            --seasons ${{ inputs.season || '2026' }} --only schedules

      - name: Fetch the feeds the card reads
        id: feeds
        # The freshness check below grades rosters, depth charts, injuries,
        # snap counts and player stats, and this job used to fetch only the
        # schedule — so every feed read MISSING and the check could never pass
        # once the season started. The same --card-only set the gameday run
        # fetches, so the check grades what the card will actually read.
        continue-on-error: true
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/fetch_football_data.py \
            --seasons ${{ inputs.season || '2026' }} --card-only

      - name: Build the processed tables the checks read
        # The coverage check reads data/processed/team_games.csv, which the
        # schedule fetch does not write — it writes the raw file. On a fresh
        # runner nothing built the processed table, so the check exited 2
        # ("No team games at ...") on its very first run, eight days before
        # Week 1. A watchdog that has never been fired is an assumption.
        # `|| true` was here and swallowed an argument error, which is the
        # same silent-failure pattern this lab keeps finding — written into
        # the fix for a silent failure. continue-on-error records the outcome
        # instead of hiding it, and the gate below can then tell a broken job
        # from a real finding.
        continue-on-error: true
        run: |
          PYTHONPATH=src python scripts/build_datasets.py \
            --seasons 2023 2024 2025 ${{ inputs.season || '2026' }}

      - name: Is the ledger intact?
        id: coverage
        # The exit status is recorded, not just the outcome: 1 (a day LOST),
        # 2 (inputs absent) and 3 (settled without a snapshot) are different
        # facts with different remedies, and the classifier names each.
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=src python scripts/run_slate_coverage.py \
            --season ${{ inputs.season || '2026' }} > /tmp/coverage.md
          code=$?
          set -e
          cat /tmp/coverage.md
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Can the card hold an opinion?
        id: freshness
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=src python scripts/run_feed_freshness.py \
            --season ${{ inputs.season || '2026' }} > /tmp/freshness.md
          code=$?
          set -e
          cat /tmp/freshness.md
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # The one form of self-improvement that is safe to automate: refitting
      # on more data. The maps are monotone transforms fitted walk-forward, so
      # a week of settled rows makes them better without anyone choosing
      # anything. Structural changes are NOT automated — those go through the
      # verdicts door, which is a human reading a measurement.
      - name: Refit calibration on everything settled so far
        id: recalibrate
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/fit_calibration.py \
            --include-forward --before-season 2027 | tee /tmp/calibration.md

      # Reading the ledger back applies every instrument the historical work
      # earned: settlement suspects excluded, intervals clustered by game, and
      # the family correction taken from the CUMULATIVE experiment tally rather
      # than from however many things this week happened to look at.
      - name: What does the accumulated ledger support?
        id: evidence
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/run_forward_evidence.py | tee /tmp/evidence.md

      - name: Record what was tested
        continue-on-error: true
        run: |
          PYTHONPATH=src python scripts/record_experiments.py \
            --search weekly-ledger-read \
            --hypotheses "pooled forward return" \
            --seasons ${{ inputs.season || '2026' }} \
            --outcome "recorded weekly"

      - name: Name what this run found
        # One classifier, read by both steps below, so the comment and the red
        # X cannot disagree. It maps each check's recorded exit status to
        # words — never a phrase grep over the reports, which matched the
        # coverage report's own opening sentence on every run and called a
        # stale feed "evidence that cannot be recovered".
        id: verdict
        if: always()
        env:
          SCHEDULE: ${{ steps.schedule.outcome }}
          FEEDS: ${{ steps.feeds.outcome }}
          COVERAGE_CODE: ${{ steps.coverage.outputs.code }}
          FRESHNESS_CODE: ${{ steps.freshness.outputs.code }}
        run: |
          set -euo pipefail
          python scripts/classify_weekly_check.py > /tmp/verdict.md
          cat /tmp/verdict.md

      - name: Report to the operating home
        # Always: the case that most needs reporting is the one where a step
        # above died.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ steps.verdict.outputs.failed }}
        run: |
          set -euo pipefail
          TITLE="Football Betting Lab — Claude Operating Home"
          NUMBER=$(gh issue list --state all --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -z "$NUMBER" ]; then
            echo "::warning::No operating-home issue titled '$TITLE'. Nothing was posted."
            exit 0
          fi
          BODY=$(mktemp)
          # A clean week posts one line. Roughly 18 comments a season, not 300:
          # a report that arrives every week in full trains the reader to stop
          # opening the one that matters.
          if [ "$FAILED" = "false" ]; then
            echo "### Weekly ledger check — intact" > "$BODY"
            echo "" >> "$BODY"
            echo "Every game day played so far was frozen and settled, and every feed is current." >> "$BODY"
          else
            {
              echo "### Weekly ledger check — ATTENTION"
              echo ""
              if [ -s /tmp/verdict.md ]; then
                cat /tmp/verdict.md
              else
                echo "- **watchdog**: this run could not classify its own result. Read the run log before trusting anything below."
              fi
              echo ""
              [ -s /tmp/coverage.md ] && cat /tmp/coverage.md
              echo ""
              [ -s /tmp/freshness.md ] && cat /tmp/freshness.md
              echo ""
              [ -s /tmp/evidence.md ] && cat /tmp/evidence.md
            } > "$BODY"
          fi
          {
            echo ""
            echo "---"
            echo "[Run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$BODY"
          gh issue comment "$NUMBER" --body-file "$BODY"

      - name: Fail the run, and say which kind of failure it was
        # Two different alarms wearing one label is worse than no alarm. The
        # first run of this workflow reported "a scheduled game day has no
        # frozen opinions — that evidence cannot be recovered" when what had
        # actually happened is that the check could not read its own input
        # file. One of those is irreversible and one is a missing build step,
        # and a watchdog that cannot tell them apart teaches the reader to
        # ignore it. The words come from the classifier above; a run it could
        # not classify fails as a broken watchdog, never as a clean week.
        if: always()
        env:
          FAILED: ${{ steps.verdict.outputs.failed }}
        run: |
          set -u
          if [ "$FAILED" = "false" ]; then
            echo "Ledger intact and every feed current."
            exit 0
          fi
          if [ "$FAILED" != "true" ] || [ ! -s /tmp/verdict.md ]; then
            echo "::error::The weekly check could not classify its own result. This is a broken watchdog, NOT evidence that a game day was lost. Fix the job before trusting its silence."
            exit 1
          fi
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done < /tmp/verdict.md
          exit 1
