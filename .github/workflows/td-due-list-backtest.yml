name: TD Due List Backtest

# Measures the NFL TD Due List (src/football_betting_lab/td_due_list.py)
# against the bought 2023-25 anytime prices. Spends NO credits: the prices
# were bought once by Historical Purchase and live in its artifact, which this
# restores read-only. Manual dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    name: TD Due List Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt && python -m pip install -e .

      - name: Restore the bought prices
        # Read only. The same reach-back Historical Purchase uses, because
        # `actions/download-artifact` sees only the current run's artifacts.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data/raw/nfl/historical_prices
          for RUN in $(gh run list --workflow=historical-purchase.yml \
                --status=success --limit 15 --json databaseId \
                --jq '.[].databaseId'); do
            if gh run download "$RUN" -n historical-prices \
                 -D data/raw/nfl/historical_prices 2>/dev/null; then
              echo "Restored from run $RUN."
              break
            fi
          done
          COUNT=$(find data/raw/nfl/historical_prices -name '*.json' | wc -l)
          echo "$COUNT cached response file(s) restored."
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No bought prices restored; the priced half cannot run."
            exit 1
          fi

      - name: Fetch and build the player logs
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          SEASONS="2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026"
          python scripts/fetch_football_data.py --seasons $SEASONS --only player_stats rosters schedules
          python scripts/build_datasets.py --seasons $SEASONS

      - name: Run the backtest
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/run_td_due_list_backtest.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo "----- nfl_td_due_list_backtest.json -----"
          cat data/outputs/nfl_td_due_list_backtest.json

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td-due-list-backtest
          path: |
            data/outputs/nfl_td_due_list_backtest.json
            data/outputs/nfl_td_due_list_backtest.md
            data/outputs/nfl_td_due_list_backtest_bets.csv
          if-no-files-found: warn
          retention-days: 90
