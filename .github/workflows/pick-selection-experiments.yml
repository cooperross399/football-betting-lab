name: Pick Selection Experiments

# Runs the four pre-registered tests in docs/preregistered_pick_selection.md
# against the bought 2023-25 ladder prices. Spends NO credits: the prices were
# bought once by Historical Purchase and live in its artifact, which this
# restores read-only. It also re-keeps that artifact, because the original
# expires 2026-11-26 and the purchase cost 587,732 credits.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  experiments:
    name: Pick Selection Experiments
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt && python -m pip install -e .

      - name: Restore the bought prices
        # Read only. The same reach-back Historical Purchase uses, because
        # `actions/download-artifact` sees only the current run's artifacts.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data/raw/nfl/historical_prices
          for RUN in $(gh run list --workflow=historical-purchase.yml \
                --status=success --limit 15 --json databaseId \
                --jq '.[].databaseId'); do
            if gh run download "$RUN" -n historical-prices \
                 -D data/raw/nfl/historical_prices 2>/dev/null; then
              echo "Restored from run $RUN."
              break
            fi
          done
          COUNT=$(find data/raw/nfl/historical_prices -name '*.json' | wc -l)
          echo "$COUNT cached response file(s) restored."
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No bought prices restored; the experiments cannot run."
            exit 1
          fi

      - name: Keep a second copy of the bought prices
        uses: actions/upload-artifact@v4
        with:
          name: historical-prices-kept
          path: data/raw/nfl/historical_prices
          if-no-files-found: error
          retention-days: 90

      - name: Run the experiments
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/run_pick_selection_experiments.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo "----- nfl_pick_selection.json -----"
          cat data/outputs/nfl_pick_selection.json

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pick-selection-experiments
          path: |
            data/outputs/nfl_pick_selection.json
            data/outputs/nfl_pick_selection.md
            data/outputs/nfl_pick_selection_rungs.csv.gz
          if-no-files-found: warn
          retention-days: 90
