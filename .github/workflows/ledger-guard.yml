# Ledger Guard — the append-only rule, checked at the diff instead of at runtime.
#
# `ExperimentLedger.save()` in src/football_betting_lab/experiment_ledger.py
# refuses a shrink. It measured its floor by re-reading the file it was about
# to overwrite, and this comment used to say that meant it "could not fire".
# Corrected 2026-09-04 by restoring the pre-floor save() from ac6d9b2 and
# running it: an IN-PROCESS shrink of the real ledger — load 53, drop eighteen
# in memory, save — raised `The experiment ledger would fall from 53 entries
# to 35`. The old guard fired.
#
# What it could not see is the edit that was actually made: eighteen
# hypotheses hand-deleted from data/outputs/experiment_ledger.json ON DISK
# (53 -> 35) and committed. The recorder then loads a file that is already
# short, so the floor it re-reads is 35 and the comparison is 35 against 35.
# Measured: exit 0, `35 distinct hypotheses (+0)`, the .md re-rendered from
# x1.69 to x1.63, and CI green. Nothing is re-added — the recorder only
# appends what it is asked for, and it is run here with no arguments.
#
# save() now takes an explicit floor and the recorder passes the count
# committed at HEAD, which closes the on-disk edit for anything that runs
# inside a checkout. But a PR diff never calls save() at all, and a PR diff is
# exactly how a ledger reaches main. This workflow is that missing half: it
# compares the ledger on the head against the ledger at the base and refuses
# any run in which a recorded hypothesis was removed or rewritten. Lose
# entries quietly and the lab reports a correction smaller than the truth,
# which is the failure the rule names.
#
# This workflow READS and never writes. It holds `contents: read`, so it cannot
# commit, push, or "repair" a ledger — a guard that can rewrite the evidence has
# failure modes that include rewriting the evidence. It accesses the `secrets`
# context nowhere; tests/test_workflows.py reads this file's raw text and fails
# on the context being accessed in any spelling.
#
# A base ref it cannot resolve is a HARD STOP, not a pass. "There was no prior
# ledger" and "I could not read the prior ledger" must never take the same
# branch: the first is an honest first commit, the second is a broken guard, and
# a broken guard reporting green is worse than no guard at all.
#
# It is a separate workflow rather than a job inside tests.yml so its red tick
# carries its own name in the PR. Two different alarms wearing one label is worse
# than one alarm. It is NOT the required status check — `Tests` is — so it is a
# visible red on the PR rather than a merge block until Cooper adds it to the
# branch protection; that is his call and not a workflow's.

name: Ledger Guard

on:
  # No `paths:` filter: a path-filtered check hangs pending forever, and the
  # render can break from a change that never touches data/outputs/. No
  # `branches:` filter on the pull request either: a ledger edited on a side
  # branch reaches main through a merge, and the check runs BEFORE the merge.
  #
  # The FIRST push of a new branch carries an all-zeros `github.event.before`,
  # because there is no previous tip of a ref that did not exist. This used to
  # be a hard stop, so every new branch's first push was red. Fail-closed is
  # the right instinct and that was the wrong place to apply it: a check that
  # is red on every branch's first push is a check people learn to scroll
  # past, and a guard nobody reads is a guard that is not running. The zeros
  # are not an unresolvable base — they are a base that has to be resolved
  # differently, as `git merge-base HEAD origin/main`, which is exactly the
  # range the push introduced. Every OTHER unresolvable base is still a hard
  # stop.
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledger-guard-${{ github.ref }}
  # A PR run compares the whole head against the PR's base, so a superseded
  # one is re-done in full by the run that replaced it. A push run compares
  # exactly one range, before -> head, and cancelling it means that range is
  # never compared by anything.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  append_only:
    name: Ledger Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          # The comparison reads a blob out of the base commit; a shallow clone
          # makes the base unreadable, which the resolve step turns into a red
          # build rather than a silent pass.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve the base commit, or stop
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # GitHub's all-zeros sentinel for "this ref did not exist before".
          ZEROS="0000000000000000000000000000000000000000"
          case "${EVENT_NAME}" in
            pull_request) BASE="${PR_BASE_SHA}" ;;
            push)
              if [ "${PUSH_BEFORE_SHA}" = "${ZEROS}" ]; then
                # A branch's first push. There is no previous tip to compare
                # against, so the range this push introduced is everything
                # since it left main — which is what merge-base names. Fetch
                # first: a checkout may hold no remote-tracking main, and
                # resolving against a ref that is not there would be the same
                # false red in a new costume.
                git fetch --no-tags --quiet origin main || { echo "::error::Cannot fetch origin/main to resolve the base of a first push. The append-only check did not run. This is a broken guard, NOT evidence that the ledger is intact."; exit 1; }
                BASE="$(git merge-base HEAD FETCH_HEAD)" || { echo "::error::No merge base between HEAD and origin/main. The append-only check did not run. This is a broken guard, NOT evidence that the ledger is intact."; exit 1; }
                echo "First push of this ref: comparing against the merge base with origin/main."
              else
                BASE="${PUSH_BEFORE_SHA}"
              fi
              ;;
            workflow_dispatch) BASE="origin/main" ;;
            *)
              echo "::error::Unhandled event ${EVENT_NAME}. The append-only check did not run. This is a broken guard, NOT evidence that the ledger is intact."
              exit 1
              ;;
          esac
          if [ -z "${BASE}" ]; then
            echo "::error::No base ref for event ${EVENT_NAME}. The append-only check did not run. This is a broken guard, NOT evidence that the ledger is intact."
            exit 1
          fi
          # A force-pushed-away sha, a shallow clone, or a merge base that
          # resolved to something git no longer has all land here. Every one
          # means the comparison cannot be made — which is a failure, never a
          # pass. The all-zeros `before` is handled above and does not reach
          # this line: it is resolvable, just not by cat-file.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::Cannot resolve the base commit ${BASE}. The append-only check did not run. This is a broken guard, NOT evidence that the ledger is intact."
            exit 1
          fi
          echo "sha=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Base commit: ${BASE}"

      - name: Extract the ledger as it stands at the base
        id: extract
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          # The base tree must be readable at all. If this fails the checkout
          # is broken, which is a different thing from "the ledger was not
          # there" — and it is what lets the absent branch below be honest.
          if ! git ls-tree "${BASE}" -- data/outputs/ >/dev/null; then
            echo "::error::Cannot read the base tree at ${BASE}. The append-only check did not run. This is a broken guard, NOT evidence that the ledger is intact."
            exit 1
          fi
          if git cat-file -e "${BASE}:data/outputs/experiment_ledger.json" 2>/dev/null; then
            # Temp-then-move: `git show REF:file > file` creates the target
            # even when it fails, and a zero-byte ledger must not travel on.
            TMP="$(mktemp)"
            git show "${BASE}:data/outputs/experiment_ledger.json" > "${TMP}"
            if [ -s "${TMP}" ]; then
              mv "${TMP}" "${RUNNER_TEMP}/base_ledger.json"
            else
              rm -f "${TMP}"
              echo "::error::The base ledger exists but came back empty."
              exit 1
            fi
            echo "base_present=true" >> "$GITHUB_OUTPUT"
            echo "Base ledger extracted from ${BASE}."
          else
            echo "base_present=false" >> "$GITHUB_OUTPUT"
            echo "No ledger at the base commit ${BASE}. First-commit state."
          fi

      - name: Refuse a removed or rewritten hypothesis
        env:
          BASE_PRESENT: ${{ steps.extract.outputs.base_present }}
        # The comparison lives in a Python script with unit tests
        # (tests/test_check_ledger_append_only.py), not in shell, so it can be
        # exercised without pushing a PR. There is no allowlist, no --force,
        # and no env-var waiver, because a gate with a waiver is a gate that
        # will be waived.
        run: |
          set -euo pipefail
          if [ ! -f scripts/check_ledger_append_only.py ]; then
            echo "::error::scripts/check_ledger_append_only.py is missing. The append-only check did not run. This is a broken guard, NOT evidence that the ledger is intact."
            exit 1
          fi
          if [ "${BASE_PRESENT}" = "true" ]; then
            python scripts/check_ledger_append_only.py \
              --base "${RUNNER_TEMP}/base_ledger.json" \
              --head data/outputs/experiment_ledger.json \
              | tee "${RUNNER_TEMP}/ledger_check.txt"
          else
            python scripts/check_ledger_append_only.py \
              --base-absent \
              --head data/outputs/experiment_ledger.json \
              | tee "${RUNNER_TEMP}/ledger_check.txt"
          fi

      - name: Re-render the ledger from source and demand no diff
        # Running the recorder exercises the runtime floor in save() against
        # CI's copy of the ledger, the diff proves the tracked .md is the
        # render of the tracked .json rather than a hand-edited artefact, and
        # tracked-ness is asserted BEFORE the render, because `git diff` is
        # blind to a file that was deleted and then recreated untracked.
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- data/outputs/experiment_ledger.json data/outputs/experiment_ledger.md >/dev/null || { echo '::error::A tracked ledger file was deleted. The ledger is append-only; removing the render removes the record.'; exit 1; }
          PYTHONPATH=src python scripts/record_experiments.py
          git diff --exit-code -- data/outputs/experiment_ledger.json data/outputs/experiment_ledger.md
          test -z "$(git status --porcelain -- data/outputs/)" || { git status --porcelain -- data/outputs/; echo '::error::The ledger render left untracked output.'; exit 1; }

      - name: Summarise
        env:
          BASE: ${{ steps.base.outputs.sha }}
          BASE_PRESENT: ${{ steps.extract.outputs.base_present }}
        run: |
          set -euo pipefail
          # Read into a variable FIRST: `echo "$(head -n 1 missing)"` exits 0
          # under `set -euo pipefail`, because echo succeeds and the
          # substitution's status is discarded.
          SUMMARY_LINE="$(head -n 1 "${RUNNER_TEMP}/ledger_check.txt")"
          [ -n "${SUMMARY_LINE}" ] || { echo '::error::The append-only check left no output to summarise. Nothing was compared, and a summary without the count is not a report.'; exit 1; }
          echo "Ledger Guard: ${SUMMARY_LINE} — base ${BASE} (ledger present at base: ${BASE_PRESENT})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the ledgers that were compared
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-check
          path: |
            ${{ runner.temp }}/base_ledger.json
            ${{ runner.temp }}/ledger_check.txt
            data/outputs/experiment_ledger.json
            data/outputs/experiment_ledger.md
          if-no-files-found: error
